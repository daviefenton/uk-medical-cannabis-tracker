name: Probe sources
on:
  workflow_dispatch:
    inputs:
      urls: { description: 'Space-separated URLs (blank = default list)', required: false, default: '' }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe.mjs ${{ inputs.urls }}
