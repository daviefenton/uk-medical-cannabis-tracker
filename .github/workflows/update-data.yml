name: Update product data
on:
  schedule: [{ cron: '17 */6 * * *' }]   # every 6 hours
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update.mjs
      - name: Commit and redeploy if data changed
        run: |
          git config user.name "leafwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: automated update" && git push
          # pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
          scripts/deploy-gh-pages.sh
