name: Update product data
on:
  schedule: [{ cron: '17 */6 * * *' }]   # every 6 hours
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
jobs:
  update:
    runs-on: ubuntu-latest
    outputs: { changed: '${{ steps.c.outputs.changed }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update.mjs
      - id: c
        name: Commit if data changed
        run: |
          git config user.name "leafwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: automated update" && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
  # pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
